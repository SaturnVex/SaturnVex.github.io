<div class="col-lg-4 col-md-6">
  <a class="card svx-card h-100 overflow-hidden text-decoration-none" href="{{ include.p.url | relative_url }}">
    <img src="{{ include.p.image | replace: 'cover-1.jpg', 'card.jpg' | relative_url }}" class="card-img-top" alt="{{ include.p.title }}" loading="lazy">
    <div class="card-body d-flex flex-column">
      <div class="small svx-code mb-1">{{ include.p.code }}</div>
      <h3 class="h5">{{ include.p.title }}</h3>
      <p class="text-secondary small flex-grow-1">{{ include.p.summary }}</p>
      <span class="small svx-link">View product <i class="bi bi-arrow-right"></i></span>
    </div>
  </a>
</div>
